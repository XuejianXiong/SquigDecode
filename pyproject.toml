[tool.pytest.ini_options]
addopts = "-p no:warnings"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squigdecode"
version = "0.1.0"
description = "Signal-to-Base decoder for high-SNR nanopore sequencing"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Janet", email = ""}
]
keywords = ["basecalling", "nanopore", "sequencing", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=25.11.0",
    "isort>=6.1.0",
]
notebook = [
    "ipykernel>=6.31.0",
]
ml = [
    "scikit-learn>=1.6.0",
]

[project.urls]
"Homepage" = "https://github.com/user/squigdecode"
"Bug Reports" = "https://github.com/user/squigdecode/issues"
"Source" = "https://github.com/user/squigdecode"
